<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1726">
  <title>Apu Torna – Admin</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #0d1726; --card: #16263f; --card2: #1f3456; --line: #2c4470; --text: #eef3fb; --muted: #9fb3cf; --accent: #ff9f1c; --green: #3ecf8e; --red: #ff6b6b; --gold: #ffd166; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 "Segoe UI", Roboto, Arial, sans-serif; }
    header { position: sticky; top: 0; z-index: 5; background: #0a1220; border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; }
    header h1 img { width: 30px; height: 30px; }
    nav { display: flex; gap: 6px; flex-wrap: wrap; }
    nav button { background: var(--card); color: var(--muted); border: 0; border-radius: 10px; padding: 8px 12px; font: inherit; cursor: pointer; }
    nav button.on { background: var(--accent); color: #1b1200; font-weight: 700; }
    .mode { margin-left: auto; font-size: 13px; color: var(--muted); }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    section { display: none; } section.on { display: block; }
    .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .card h2 { font-size: 18px; margin: 0 0 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .kpi { background: var(--card2); border-radius: 12px; padding: 12px; }
    .kpi b { display: block; font-size: 28px; }
    .kpi span { color: var(--muted); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { color: var(--muted); font-weight: 600; font-size: 13px; }
    input, select, textarea { background: #0b1526; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
    input[type=number] { width: 76px; }
    textarea { width: 100%; min-height: 60px; }
    label.f { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
    label.f input:not([type=checkbox]), label.f select, label.f textarea { width: 100%; color: var(--text); }
    .btn { background: var(--card2); color: var(--text); border: 0; border-radius: 10px; padding: 8px 14px; font: inherit; cursor: pointer; white-space: nowrap; }
    .btn.pri { background: var(--accent); color: #1b1200; font-weight: 700; }
    .btn.red { background: #4a1f1f; color: #ffc9c9; }
    .btn.rec { background: #5a1a1a; color: #fff; }
    .btn.rec.on { background: var(--red); animation: bl 1s infinite; }
    @keyframes bl { 50% { opacity: .6; } }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .muted { color: var(--muted); }
    .flag { background: #3a1e1e; color: #ffc9c9; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }
    .ok { color: var(--green); }
    .pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; background: var(--card2); }
    .pill.rec { background: #163d33; color: var(--green); }
    .kid { display: flex; gap: 14px; align-items: flex-start; background: var(--card2); border-radius: 12px; padding: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    .kid .ph { width: 90px; height: 90px; border-radius: 50%; background: #0b1526 center/cover; border: 3px solid var(--accent); flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 32px; }
    .kid .body { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 8px; }
    .phr { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .phr .t { font-size: 15px; }
    .phr .k { font-size: 12px; color: var(--muted); }
    .bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; }
    .bars div { flex: 1; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
    .bars div.zero { background: var(--line); }
    .barLbl { display: flex; gap: 4px; font-size: 10px; color: var(--muted); }
    .barLbl span { flex: 1; text-align: center; }
    .warn { background: #3b2a10; color: #ffd9a0; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
    .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--green); color: #04210f; padding: 10px 18px; border-radius: 10px; font-weight: 700; display: none; z-index: 10; }
    details summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
    @media (max-width: 640px) { th:nth-child(2), td:nth-child(2) { display: none; } }
  </style>
</head>
<body>
  <header>
    <h1><img src="icon.svg" alt="">Apu Torna – admin</h1>
    <nav id="nav">
      <button data-tab="ov" class="on">Áttekintés</button>
      <button data-tab="ex">Gyakorlatok</button>
      <button data-tab="kids">Unokák</button>
      <button data-tab="voice">Hangfelvételek</button>
      <button data-tab="set">Beállítások</button>
      <button data-tab="data">Adatok</button>
    </nav>
    <span class="mode" id="mode"></span>
    <a class="btn" href="index.html">↩ App</a>
  </header>
  <main>
    <section id="ov" class="on"></section>
    <section id="ex"></section>
    <section id="kids"></section>
    <section id="voice"></section>
    <section id="set"></section>
    <section id="data"></section>
  </main>
  <div class="toast" id="toast"></div>

  <script src="exercises.js"></script>
  <script src="engine.js"></script>
  <script src="phrases.js"></script>
  <script src="figures.js"></script>
  <script src="store.js"></script>
  <script src="voice.js"></script>
  <script src="admin.js"></script>
</body>
</html>
